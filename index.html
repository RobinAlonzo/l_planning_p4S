<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'none'; base-uri 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d3a8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ORION</title>
<style>


:root {
  --bg: #eef0f4; --surface: #ffffff; --ink: #18202e; --muted: #5d6779; --line: #d3d8e2;
  --accent: #1d3a8a; --accent-ink: #ffffff; --accent-soft: #dfe6f8; --weekend: #e3e4f0; --empty: #e8ebf0;
  --ok: #1d7a3a; --warn: #9a5b00; --warn-soft: #fff1d6;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-code: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151d; --surface: #1a202b; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c3442;
  --accent: #8fa8ff; --accent-ink: #0d1424; --accent-soft: #24304d; --weekend: #1f2233; --empty: #232a36;
  --ok: #5fcf83; --warn: #f0b44c; --warn-soft: #3a2c12; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #1a202b; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c3442;
  --accent: #8fa8ff; --accent-ink: #0d1424; --accent-soft: #24304d; --weekend: #1f2233; --empty: #232a36;
  --ok: #5fcf83; --warn: #f0b44c; --warn-soft: #3a2c12; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.4; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.titlebar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.sub { color: var(--muted); margin: 0; }
.eyebrow, .field label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }


.drop { display: grid; gap: 10px; justify-items: start; border: 2px dashed var(--line); border-radius: 10px; padding: 22px 18px; background: var(--surface); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { font-size: 1.15rem; }
.drop p { margin: 0; color: var(--muted); max-width: 64ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.privacy { font-size: 0.85rem; color: var(--muted); margin: 0; max-width: 72ch; }
.progress { display: grid; gap: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--empty); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.err { color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 10px 12px; margin: 0; }

button, .btn { font: inherit; font-weight: 600; border-radius: 6px; padding: 9px 14px; cursor: pointer; border: 1px solid var(--accent); display: inline-block; }
.primary { background: var(--accent); color: var(--accent-ink); }
.ghost { background: transparent; color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, .drop:focus-within, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type="date"], input[type="text"] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); min-width: 0; }
#person { font-size: 1.05rem; font-weight: 600; width: 100%; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 260px; }
.range { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; }
.range small { font-weight: 500; color: var(--muted); font-size: 0.85rem; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stat { display: grid; }
.stat b { font-family: var(--font-code); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.92rem; color: var(--muted); cursor: pointer; }
.toast { font-size: 0.9rem; color: var(--ok); min-height: 1.2em; }
.badge { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); }
.badge.okb { background: var(--accent-soft); color: var(--accent); }


details.panel > summary { cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.review { display: grid; gap: 16px; margin-top: 12px; }
.motifs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.motif { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.motif.unsure { border-color: var(--warn); background: var(--warn-soft); }
.motif img { image-rendering: pixelated; width: 54px; height: auto; border-radius: 3px; }
.motif small { grid-column: 1 / -1; color: var(--muted); font-size: 0.75rem; }
.motif select { width: 100%; font-family: var(--font-code); }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 10px; }
.names input { width: 100%; }


.weekhead, .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.weekhead div { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; padding-inline: 4px; }
.cal { display: grid; gap: 6px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.day.pad { background: transparent; border-style: dashed; }
.day.we { background: var(--weekend); }
.day.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.dhead { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.dnum { font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }
.dname { display: none; color: var(--muted); font-size: 0.85rem; }
.tag { font-size: 0.66rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.slots { display: grid; gap: 4px; }
.slot { display: grid; grid-template-columns: 1.1em 1fr; gap: 4px; align-items: start; }
.sl { font-family: var(--font-code); font-size: 0.7rem; color: var(--muted); padding-top: 3px; }
.chip { font-family: var(--font-code); font-weight: 600; font-size: 0.8rem; border-radius: 3px; padding: 2px 5px; min-height: 1.45em; display: block; line-height: 1.3; }
.chip.empty { background: var(--empty); }
.with { grid-column: 2; font-size: 0.74rem; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
.with b { color: var(--ink); font-weight: 600; }
.with { display: grid; gap: 2px; }
.mate { display: flex; gap: 5px; align-items: baseline; min-width: 0; }
.mtag { font-family: var(--font-code); font-size: 0.68rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 3px; min-width: 2.1em; text-align: center; flex: none; }

.legend ul { list-style: none; margin: 10px 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
.legend li { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; }
.legend .chip { min-width: 2.6em; text-align: center; }
.note { color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 72ch; }
textarea { width: 100%; min-height: 140px; font-family: var(--font-code); font-size: 0.75rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 720px) {
  .weekhead { display: none; }
  .week { grid-template-columns: 1fr; }
  .day.pad { display: none; }
  .dname { display: inline; }
  .day { grid-template-columns: 6.5em 1fr; column-gap: 10px; }
  .dhead { flex-direction: column; justify-content: start; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

.help { display: grid; gap: 8px; }
.help details { border-top: 1px solid var(--line); padding-top: 8px; }
.help summary { cursor: pointer; font-weight: 600; }
.help ol { margin: 8px 0 4px; padding-left: 1.3em; display: grid; gap: 4px; max-width: 72ch; }
.help ul { margin: 4px 0; padding-left: 1.1em; }
.privacy-box { display: grid; gap: 10px; }
#famBox > summary { cursor: pointer; font-weight: 600; }
.famsteps { margin: 8px 0; padding-left: 1.3em; display: grid; gap: 4px; }
.famlist { display: grid; gap: 6px; margin-top: 8px; }
.fam { display: grid; grid-template-columns: 5.5em 1fr auto auto; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 6px; }
.fam .chip { text-align: center; }
.faminfo { display: grid; min-width: 0; }
.faminfo small { color: var(--muted); }
.famhex { font-family: var(--font-code); font-size: 0.8rem; padding: 6px 8px; }
@media (max-width: 480px) { .fam { grid-template-columns: 4.5em 1fr; } .famhex, .fam .primary { justify-self: start; } }
.sscolors { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 12px; margin-top: 8px; }
.sscolors button { display: flex; gap: 8px; align-items: center; background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; text-align: left; padding: 6px 8px; }
.sscolors .chip { min-width: 2.6em; text-align: center; }
.sscolors code { font-family: var(--font-code); color: var(--muted); margin-left: auto; }

.gate { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 40px; }
.gate form { width: min(100%, 380px); display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.gate h1 { font-size: 1.5rem; }
.gate input[type="password"] { width: 100%; font-size: 1.1rem; }
.gate .err { font-size: 0.9rem; }
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>ORION</h1>
    <p class="note">Accès réservé. Saisissez le mot de passe.</p>
    <input type="password" id="pw" aria-label="Mot de passe" placeholder="Mot de passe" autocomplete="current-password" required>
    <label class="check" for="remember"><input type="checkbox" id="remember" checked> Se souvenir sur cet appareil</label>
    <button class="primary" type="submit" id="go">Entrer</button>
    <p class="err" id="gerr" hidden>Mot de passe incorrect.</p>
  </form>
</div>
<div id="root"></div>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/tesseract/tesseract.min.js"></script>
<script src="app.data.js"></script>
<script>
(() => {
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const tob64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const D = window.APP_PAYLOAD;
  const KEY = "k1";
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(D.salt), iterations: D.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, key, b64(D.ct));
    const app = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById("gate").remove();
    document.getElementById("root").innerHTML = app.markup;
    window.appLock = () => { ls.del(KEY); location.reload(); };
    new Function(app.script)();
  }
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
  (async () => {
    const saved = ls.get(KEY);
    if (saved) {
      try { await open(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"])); return; }
      catch (e) { ls.del(KEY); }
    }
    document.getElementById("pw").focus();
  })();
  document.getElementById("gateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Vérification…";
    document.getElementById("gerr").hidden = true;
    const remember = document.getElementById("remember").checked;
    try {
      const key = await derive(document.getElementById("pw").value);
      await open(key);
      if (remember) ls.set(KEY, tob64(await crypto.subtle.exportKey("raw", key)));
    } catch (err) {
      console.error(err);
      const g = document.getElementById("gerr"); if (!g) return;
      g.textContent = err && err.name === "OperationError" ? "Mot de passe incorrect." : "Le site n'a pas pu démarrer sur ce navigateur. Essayez avec Safari, Chrome, Edge ou Firefox à jour.";
      g.hidden = false;
      btn.disabled = false; btn.textContent = "Entrer";
    }
  });
})();
</script>
</body>
</html>
